<h2>Markdown 编辑器布局？</h2>
<p class="subtitle">左侧编辑、右侧实时预览是最常见的方案，但还有其他选择</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>左右分栏</h3>
      <p>左侧编辑区 + 右侧实时预览，经典方案，适合宽屏</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>上下分栏</h3>
      <p>上方编辑区 + 下方预览区，适合窄屏或移动端</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>编辑/预览切换</h3>
      <p>单面板，通过 Tab 切换编辑和预览模式，最大利用屏幕空间</p>
    </div>
  </div>
  <div class="option" data-choice="d" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>所见即所得（WYSIWYG）</h3>
      <p>直接在预览效果上编辑，类似 Notion 或 Typora 的体验</p>
    </div>
  </div>
</div>
