<h2>JSON 格式化器布局？</h2>
<p class="subtitle">输入混乱的 JSON，一键格式化。你想要什么样的编辑体验？</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>单面板 + 操作按钮</h3>
      <p>一个大输入框，上方有"格式化"/"压缩"/"复制"按钮，结果覆盖显示</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>上下分栏</h3>
      <p>上方输入原始 JSON，下方显示格式化结果，方便对比</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>左右分栏</h3>
      <p>左侧输入 + 右侧结果，与 Markdown 编辑器风格统一</p>
    </div>
  </div>
</div>
